services:
  backend:
    image: open-ai-canvas-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      CANVAS_BACKEND_ADDR: ":8080"
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_SHUTDOWN_TIMEOUT: ${CANVAS_SHUTDOWN_TIMEOUT:-10m}
      CANVAS_DATABASE_DRIVER: ${CANVAS_DATABASE_DRIVER:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      CANVAS_WORKER_CONCURRENCY: ${CANVAS_WORKER_CONCURRENCY:-3}
      CANVAS_CHANNEL_CONCURRENCY: ${CANVAS_CHANNEL_CONCURRENCY:-3}
      CANVAS_REGISTRATION_ENABLED: ${CANVAS_REGISTRATION_ENABLED:-false}
      CANVAS_ALLOW_PRIVATE_UPSTREAMS: ${CANVAS_ALLOW_PRIVATE_UPSTREAMS:-false}
      CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS: ${CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS:-}
      CANVAS_CORS_ORIGINS: ${CANVAS_CORS_ORIGINS:-http://localhost:3001}
      CANVAS_UPDATER_SOCKET: /run/open-ai-canvas-updater/updater.sock
      CANVAS_UPDATER_TOKEN: ${CANVAS_UPDATER_TOKEN:-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d}
      GIN_MODE: release
    volumes:
      - backend-data:/data
      - updater-socket:/run/open-ai-canvas-updater
    restart: unless-stopped
    stop_grace_period: ${CANVAS_SHUTDOWN_TIMEOUT:-10m}

  updater:
    image: alpine:3.22
    environment:
      CANVAS_UPDATER_SOCKET: /run/open-ai-canvas-updater/updater.sock
      CANVAS_UPDATER_TOKEN: ${CANVAS_UPDATER_TOKEN:-9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d}
      CANVAS_UPDATER_INSTALL_DIR: /app
      CANVAS_UPDATER_ENV_FILE: .env
      CANVAS_UPDATER_COMPOSE_FILE: docker-compose.yml
      CANVAS_UPDATER_BACKUP_DIR: /var/lib/open-ai-canvas-updater/backups
      CANVAS_UPDATER_STATE_DIR: /var/lib/open-ai-canvas-updater/state
      CANVAS_UPDATER_SELF_UPDATE: "false"
      CANVAS_UPDATER_HEALTH_URL: http://web:3000/api/health/ready
    volumes:
      - ./.local/bin/open-ai-canvas-host-updater:/usr/local/bin/open-ai-canvas-host-updater:ro
      - updater-socket:/run/open-ai-canvas-updater
      - .:/app:ro
      - updater-state:/var/lib/open-ai-canvas-updater
    command: ["/usr/local/bin/open-ai-canvas-host-updater"]
    restart: unless-stopped

  web:
    image: open-ai-canvas-web:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${CANVAS_HTTP_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol auto run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    extra_hosts:
      - "localhost:host-gateway"
    depends_on:
      web:
        condition: service_healthy

volumes:
  backend-data:
  updater-socket:
  updater-state:
